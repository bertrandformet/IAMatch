name: Archive du tableau de bord

# Sauvegarde quotidienne d'un instantané du tableau de bord public
# (/api/dashboard, déjà anonymisé et agrégé — voir frontend/anonymisation.html)
# dans le repo : la base SQLite de production est éphémère (Render, tier
# gratuit) et repart à zéro à chaque redéploiement. Cet historique de
# snapshots est le seul moyen de garder une trace dans le temps en
# attendant une éventuelle migration vers un stockage persistant
# (Postgres/Supabase, voir docs/brief/checklist-rgpd-ia-match.md).
#
# Chaque fichier est un total CUMULÉ depuis le dernier redéploiement, pas
# un delta — un redémarrage entre deux snapshots remet les compteurs à
# zéro. scripts/rebuild_dashboard_history.py reconstruit automatiquement un
# historique cohérent (docs/dashboard-archive/cumulative.json) en détectant
# ces remises à zéro (voir sa docstring pour l'algorithme, et
# docs/dashboard-archive/README.md pour le résumé) — MAIS seulement s'il
# dispose d'un point de mesure de part et d'autre de chaque redéploiement.
# Nommer les fichiers par seule date (AAAA-MM-JJ.json) écrasait le snapshot
# précédent quand deux exécutions tombaient le même jour (ex. déclenchement
# manuel + reset entre les deux) : le point d'avant reset disparaissait
# avant même que le script de reconstruction ne le voie — observé en
# conditions réelles. Nommé par horodatage complet à la place : chaque
# exécution produit son propre fichier, jamais écrasé.

on:
  schedule:
    - cron: "0 6 * * *" # tous les jours à 6h UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupère le tableau de bord public
        run: |
          mkdir -p docs/dashboard-archive
          # --retry/--max-time : le tier gratuit Render met le service en
          # veille après inactivité, le premier appel peut prendre 30-50s
          # le temps qu'il redémarre.
          curl -sf --retry 3 --retry-delay 10 --max-time 90 \
            https://iamatch.onrender.com/api/dashboard \
            -o "docs/dashboard-archive/$(date -u +%Y-%m-%dT%H-%M-%SZ).json"

      - name: Reconstruit l'historique cumulé
        run: python3 scripts/rebuild_dashboard_history.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard-archive/
          # Chaque exécution écrit son propre fichier horodaté (jamais
          # écrasé) : il y a donc toujours quelque chose de nouveau à
          # committer, pas besoin de vérifier un diff vide.
          git commit -m "Archive du tableau de bord — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
